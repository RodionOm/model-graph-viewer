[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-graph-viewer"
version = "0.1.0"
description = "Neural network graph visualization with configurable transformation passes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphviz>=0.20.3,<0.22",
    "openvino>=2025.2,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
export = ["optimum-intel[openvino]>=1.24,<2"]

[project.scripts]
model-graph-viewer = "model_graph_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
